[project]
name = "orquestador"
version = "0.1.0"
description = "Genera un orquestador de agentes para OpenCode V2 adaptado a un proyecto y a los modelos disponibles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alfredo Pineda" }]
requires-python = ">=3.11"
keywords = ["opencode", "agents", "llm", "orchestration", "cli", "local-models"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/freddymx/orquestador_agentes"
Repository = "https://github.com/freddymx/orquestador_agentes"
Issues = "https://github.com/freddymx/orquestador_agentes/issues"

[project.scripts]
orq = "orquestador.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orquestador"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src/orquestador"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
